# You can use hex codes too, in the format #FFFFFF or #ffffff.

# \u00BB is » (double >>), ANSI and UTF-8 interpret this differently... you may even see ? due to this
prefix: "<#ffa552> Scorpion &8\u00BB"

alerts-enabled: "%prefix% &fAlerts <#00ff00>enabled"
alerts-disabled: "%prefix% &fAlerts <#ff0000>disabled"
verbose-enabled: "%prefix% &fVerbose <#00ff00>enabled"
verbose-disabled: "%prefix% &fVerbose <#ff0000>disabled"
client-brand-format: "%prefix% <#ffa552>%player% joined using %brand%"
console-specify-target: "%prefix% &cYou must specify a target as the console!"
reloading: "%prefix% &fReloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cPlayer is exempt or offline!"
player-not-this-server: "%prefix% &cPlayer is not on this server!"
spectate-return: "<click:run_command:/scorpion stopspectating><hover:show_text:\"/scorpion stopspectating\">\n%prefix% <#ffa552>Click here to return to previous location\n</hover></click>"
cannot-spectate-return: "%prefix% &cYou can only do this after spectating a player"
cannot-run-on-self: "%prefix% &cYou cannot use this command on yourself!"
upload-log: "%prefix% <#ffa552>Uploaded debug to: %url%"
upload-log-start: "%prefix% <#ffa552>Uploading log... please wait"
upload-log-not-found: "%prefix% &cUnable to find that log"
upload-log-upload-failure: "%prefix% &cSomething went wrong while uploading this log, see console for more info"

# Valid placeholders:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - extra information from the check such as offsets, not all checks will add information
alerts-format: "%prefix% <#ffa552>%player% &ffailed <#ffa552>%check_name%%experimental% <#ffa552>(x&c%vl%<#ffa552>) &7%verbose%"
alerts-format-proxy: "%prefix% <#ffa552>[&cproxy<#ffa552>] <#ffa552>%player% &ffailed <#ffa552>%check_name%%experimental% <#ffa552>(x&c%vl%<#ffa552>) &7%verbose%"
experimental-symbol: "*"

profile:
  - "%prefix% &fProfile for <#ffa552>%player%"
  - "%prefix% &fPing: <#ffa552>%ping%"
  - "%prefix% &fVersion: <#ffa552>%version%"
  - "%prefix% &fClient Brand: <#ffa552>%brand%"
  - "%prefix% &fHorizontal Sensitivity: <#ffa552>%h_sensitivity%%"
  - "%prefix% &fVertical Sensitivity: <#ffa552>%v_sensitivity%%"
  - "%prefix% &fFastMath Enabled: <#ffa552>%fast_math%"
help:
  - "/scorpion alerts <#ffa552>- &7Toggle alerts"
  - "/scorpion profile <player> <#ffa552>- &7View player info"
  - "/scorpion help <#ffa552>- &7View this help message"
  - "/scorpion debug <player> <#ffa552>- &7Developer Prediction output"
  - "/scorpion perf <#ffa552>- &7Developer ms/prediction"
  - "/scorpion reload <#ffa552>- &7Reloads the config"
  - "/scorpion spectate <player> <#ffa552>- &7Spectate a player"
  - "/scorpion verbose <#ffa552>- &7Shows every flag to you, without buffers"
  - "/scorpion log [0-255] <#ffa552>- &7Uploads a debug log for prediction flags"
